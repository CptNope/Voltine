name: checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Smoke tests
        run: node tools/smoke.js
      - name: Route checker
        run: node tools/ghost.js
