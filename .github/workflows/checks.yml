name: checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Smoke tests
        run: node tools/smoke.js
      - name: Route checker
        run: node tools/ghost.js
      - name: Gallery levels
        run: node tools/check-gallery.js
      - name: Challenge rooms
        run: node tools/check-rooms.js
      - name: Endless chunks
        run: node tools/check-chunks.js
