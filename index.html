<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voltline</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#120726">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: arcade cabinet, playful and punchy
   IDEA: a vector-display arcade machine; everything drawn in glowing strokes
   PICTURE: the game canvas itself, full width at the top
   COLOUR and TYPE: deep violet field, mint/orange/gold strokes; Chakra Petch
   LAYOUT: title row, cabinet, controls strip, touch pad on phones */
:root{color-scheme:dark;--bg:#120726;--panel:#1c0d36;--ink:#f3e9ff;--dim:#b7a3d6;--mint:#5ef2c4;--org:#ff8a3d}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#2b1150,var(--bg));color:var(--ink);font:16px/1.55 "Chakra Petch",system-ui,sans-serif;overflow-x:clip;min-height:100vh}
main{max-width:1000px;margin:0 auto;padding:clamp(16px,3vw,32px) max(4vw,12px) 40px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:14px}
h1{margin:0;font-size:clamp(32px,6vw,48px);line-height:1.05;font-weight:700;color:var(--mint);text-shadow:0 0 18px rgba(94,242,196,.45)}
header p{margin:0;color:var(--dim)}
.cab{background:var(--panel);border:2px solid #3b1f66;border-radius:18px;padding:clamp(6px,1.4vw,14px);box-shadow:0 0 0 1px #000 inset,0 20px 60px rgba(0,0,0,.5),0 0 40px rgba(124,58,237,.18)}
.screen{position:relative;aspect-ratio:480/272;border-radius:10px;overflow:hidden;background:#0d0520;outline:none}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ctrl{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:16px;color:var(--dim);font-size:15px;align-items:center}
.ctrl span{white-space:nowrap}
kbd{font:inherit;font-size:13px;color:var(--ink);background:#2a1650;border:1px solid #4a2b80;border-bottom-width:3px;border-radius:6px;padding:1px 7px;margin-right:4px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.opts button{font:500 13px "Chakra Petch",sans-serif;color:var(--dim);background:none;border:1px solid #4a2b80;border-radius:8px;padding:6px 12px;cursor:pointer;min-height:36px}
.opts button:hover,.opts button:focus-visible{color:var(--ink);border-color:var(--mint)}
.opts button[aria-pressed=false]{opacity:.6;text-decoration:line-through}
.edp{margin-top:16px;padding:14px;border:1px solid #3b1f66;border-radius:14px;background:var(--panel);display:grid;gap:10px}
.edp[hidden]{display:none}
.edrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.edp button{font:500 14px "Chakra Petch",sans-serif;color:var(--ink);background:#2a1650;border:1px solid #4a2b80;border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer}
.edp button:hover,.edp button:focus-visible{border-color:var(--mint)}
.edp label{color:var(--dim);font-size:14px}
.edp textarea{width:100%;font:13px/1.4 ui-monospace,Menlo,monospace;color:var(--ink);background:#0d0520;border:1px solid #4a2b80;border-radius:8px;padding:8px;resize:vertical}
#edMsg{color:var(--mint);font-size:14px}
.pad{display:none;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;user-select:none;-webkit-user-select:none;touch-action:none}
.touch .pad{display:flex}
.touch .ctrl>span{display:none}
.touch .ctrl{margin-top:10px}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px}
.pad button{font:700 15px "Chakra Petch",sans-serif;color:var(--ink);background:#2a1650;border:2px solid #4a2b80;border-radius:12px;touch-action:none;-webkit-tap-highlight-color:transparent}
.pad button.on{background:#3d2272;border-color:var(--mint)}
.ab{display:flex;gap:12px;align-items:center}
.ab button{width:68px;height:68px;border-radius:50%}
.ab .fire{border-color:var(--org)}
.mid{display:flex;flex-direction:column;gap:8px}
.mid button{width:64px;height:36px;font-size:12px}
@media(max-width:420px){.dpad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px)}.ab button{width:56px;height:56px}.mid button{width:52px}}
</style>
</head>
<body>
<main>
<header><h1>Voltline</h1><p>Three sectors, three wardens, one fortress. Beat each warden, take its weapon, find their weak points.</p></header>
<div class="cab"><div class="screen" id="screen" tabindex="0"><canvas id="game" aria-label="Voltline game screen"></canvas></div></div>
<div class="pad" id="pad">
<div class="dpad">
<span></span><button data-k="up">▲</button><span></span>
<button data-k="left">◀</button><span></span><button data-k="right">▶</button>
<span></span><button data-k="down">▼</button><span></span>
</div>
<div class="mid"><button data-k="start">START</button><button data-k="next">WPN</button></div>
<div class="ab"><button class="fire" data-k="fire">FIRE</button><button data-k="jump">JUMP</button></div>
</div><div class="ctrl">
<span><kbd>←</kbd><kbd>→</kbd>move</span>
<span><kbd>↑</kbd><kbd>↓</kbd>ladders</span>
<span><kbd>Z</kbd><kbd>Space</kbd>jump</span>
<span><kbd>X</kbd>fire · hold to charge</span>
<span><kbd>↓</kbd>+<kbd>Z</kbd>slide</span>
<span><kbd>Q</kbd><kbd>E</kbd>switch weapon</span>
<span><kbd>Enter</kbd>start / pause</span>
<span><kbd>M</kbd><kbd>N</kbd>music / sound</span>
<span>Gamepads work too</span>
<div class="opts"><button id="mus" type="button">Music on</button><button id="sfx" type="button">Sound on</button><button id="reset" type="button">Reset progress</button></div>
</div>
<section class="edp" id="edp" hidden>
<div class="edrow"><button type="button" id="edBoss">Boss: Prism Warden</button><button type="button" id="edTheme">Theme: Prism Grid</button><button type="button" id="edTest">Playtest</button><button type="button" id="edClear">Clear level</button><button type="button" id="edExit">Exit editor</button></div>
<label for="edCode">Level code. Copy it to share, or paste one in and load it.</label>
<textarea id="edCode" rows="3" spellcheck="false"></textarea>
<div class="edrow"><button type="button" id="edCopy">Copy code</button><button type="button" id="edLoad">Load pasted code</button><span id="edMsg" role="status"></span></div>
</section>
</main>
<script src="js/core.js"></script>
<script src="js/world.js"></script>
<script src="js/input.js"></script>
<script src="js/audio.js"></script>
<script src="js/entities.js"></script>
<script src="js/bosses.js"></script>
<script src="js/step.js"></script>
<script src="js/render.js"></script>
<script src="js/editor.js"></script>
<script src="js/main.js"></script>
</body>
</html>
