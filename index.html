<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voltline</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#120726">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: arcade cabinet, playful and punchy
   IDEA: a vector-display arcade machine; everything drawn in glowing strokes
   PICTURE: the game canvas itself, full width at the top
   COLOUR and TYPE: deep violet field, mint/orange/gold strokes; Chakra Petch
   LAYOUT: title row, cabinet, controls strip, touch pad on phones */
:root{color-scheme:dark;--bg:#120726;--panel:#1c0d36;--ink:#f3e9ff;--dim:#b7a3d6;--mint:#5ef2c4;--org:#ff8a3d}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#2b1150,var(--bg));color:var(--ink);font:16px/1.55 "Chakra Petch",system-ui,sans-serif;overflow-x:clip;min-height:100vh}
main{max-width:1000px;margin:0 auto;padding:clamp(16px,3vw,32px) max(4vw,12px) 40px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:14px}
h1{margin:0;font-size:clamp(32px,6vw,48px);line-height:1.05;font-weight:700;color:var(--mint);text-shadow:0 0 18px rgba(94,242,196,.45)}
header p{margin:0;color:var(--dim)}
.cab{background:var(--panel);border:2px solid #3b1f66;border-radius:18px;padding:clamp(6px,1.4vw,14px);box-shadow:0 0 0 1px #000 inset,0 20px 60px rgba(0,0,0,.5),0 0 40px rgba(124,58,237,.18)}
.screen{position:relative;aspect-ratio:480/272;border-radius:10px;overflow:hidden;background:#0d0520;outline:none}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ctrl{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:16px;color:var(--dim);font-size:15px;align-items:center}
.ctrl span{white-space:nowrap}
kbd{font:inherit;font-size:13px;color:var(--ink);background:#2a1650;border:1px solid #4a2b80;border-bottom-width:3px;border-radius:6px;padding:1px 7px;margin-right:4px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.opts button{font:500 13px "Chakra Petch",sans-serif;color:var(--dim);background:none;border:1px solid #4a2b80;border-radius:8px;padding:6px 12px;cursor:pointer;min-height:36px}
.opts button:hover,.opts button:focus-visible{color:var(--ink);border-color:var(--mint)}
.opts button[aria-pressed=false]{opacity:.6;text-decoration:line-through}
.pad{display:none;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;user-select:none;-webkit-user-select:none;touch-action:none}
.touch .pad{display:flex}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px}
.pad button{font:700 15px "Chakra Petch",sans-serif;color:var(--ink);background:#2a1650;border:2px solid #4a2b80;border-radius:12px;touch-action:none;-webkit-tap-highlight-color:transparent}
.pad button.on{background:#3d2272;border-color:var(--mint)}
.ab{display:flex;gap:12px;align-items:center}
.ab button{width:68px;height:68px;border-radius:50%}
.ab .fire{border-color:var(--org)}
.mid{display:flex;flex-direction:column;gap:8px}
.mid button{width:64px;height:36px;font-size:12px}
@media(max-width:420px){.dpad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px)}.ab button{width:56px;height:56px}.mid button{width:52px}}
</style>
</head>
<body>
<main>
<header><h1>Voltline</h1><p>Three sectors, three wardens, one fortress. Beat each warden, take its weapon, find their weak points.</p></header>
<div class="cab"><div class="screen" id="screen" tabindex="0"><canvas id="game" aria-label="Voltline game screen"></canvas></div></div>
<div class="ctrl">
<span><kbd>←</kbd><kbd>→</kbd>move</span>
<span><kbd>↑</kbd><kbd>↓</kbd>ladders</span>
<span><kbd>Z</kbd><kbd>Space</kbd>jump</span>
<span><kbd>X</kbd>fire · hold to charge</span>
<span><kbd>↓</kbd>+<kbd>Z</kbd>slide</span>
<span><kbd>Q</kbd><kbd>E</kbd>switch weapon</span>
<span><kbd>Enter</kbd>start / pause</span>
<span><kbd>M</kbd><kbd>N</kbd>music / sound</span>
<span>Gamepads work too</span>
<div class="opts"><button id="mus" type="button">Music on</button><button id="sfx" type="button">Sound on</button><button id="reset" type="button">Reset progress</button></div>
</div>
<div class="pad" id="pad">
<div class="dpad">
<span></span><button data-k="up">▲</button><span></span>
<button data-k="left">◀</button><span></span><button data-k="right">▶</button>
<span></span><button data-k="down">▼</button><span></span>
</div>
<div class="mid"><button data-k="start">START</button><button data-k="next">WPN</button></div>
<div class="ab"><button class="fire" data-k="fire">FIRE</button><button data-k="jump">JUMP</button></div>
</div>
</main>

 build(f){f(0,0,0,14);f(0,30,15,16);f(32,33,13,13);f(35,55,15,16);f(40,42,13,14);f(56,60,15,16);f(56,60,14,14,'^');f(58,58,12,12);

 spawns:[['w',15,14],['w',48,14],['w',62,14],['w',112,14],['w',127,14],['t',54,11],['t',89,5],['t',98,5],['t',128,14],

 movers:[],crushers:[[32,0],[38,80],[75,0],[108,0],[114,50],[120,100]]},
{name:'Sky Relay',boss:'GALE KITE',kind:'kite',W:196,cps:[2,63,112],wind:true,

 build(f){f(0,0,0,14);f(0,20,15,16);f(41,47,13,16);f(61,85,15,16);f(68,69,11,14);f(88,90,12,12);f(93,95,10,10);f(98,100,12,12);
  f(108,130,15,16);f(118,119,12,14);f(122,124,14,14,'^');f(150,195,15,16);f(194,195,0,14)},
 spawns:[['w',10,14],['w',44,12],['w',72,14],['w',80,14],['w',115,14],['w',128,14],['t',68,10],['t',118,11],['t',94,9],
  ['f',26,7],['f',38,8],['f',54,7],['f',92,6],['f',104,8],['f',136,7],['f',142,8],['p',45,12],['p',82,14],['p',156,14],['e',99,11],['e',126,14]],
 movers:[[23,12,40,0,180,0],[29,10,0,28,150,0],[35,12,40,0,200,3.14],[50,11,48,0,220,0],[57,12,0,32,160,0],[103,11,40,0,180,0],[133,12,40,0,180,0],[139,10,0,32,150,1],[145,12,40,0,200,2]],crushers:[]},
{name:'Null Core',boss:'NULL ENGINE',kind:'null',W:214,cps:[2,68,141],final:true,
 th:{edge:'#e8e8ff',fill:'#14101f',sky:['#050308','#140a1c','#2a0a1a'],r1:['#ff3b5c','#0c0610'],r2:['#b9b4d6','#120c18'],spike:'tri',deco:'core'},
 build(f){f(0,0,0,14);f(0,18,15,16);f(19,30,16,16);f(19,30,15,15,'>');f(36,70,15,16);f(44,46,14,14,'^');f(45,45,11,11);f(52,54,12,14);f(61,64,0,13);
  f(71,74,15,16);f(72,74,5,14);f(71,71,5,14,'H');f(75,96,16,16);f(75,96,15,15,'^');f(97,130,15,16);f(105,118,15,15,'<');f(122,123,12,14);
  f(141,213,15,16);f(158,160,14,14,'^');f(159,159,12,12);f(212,213,0,14)},
 spawns:[['w',10,14],['w',40,14],['w',57,14],['w',67,14],['w',100,14],['w',126,14],['w',145,14],['w',166,14],['t',53,11],['t',73,4],['t',122,11],['t',155,14],
  ['f',28,8],['f',48,8],['f',85,6],['f',112,8],['f',136,7],['f',164,8],['p',38,14],['p',98,14],['p',147,14],['p',178,14],['e',58,14],['e',128,14],['e',176,14]],
 movers:[[33,12,24,0,140,0],[78,9,0,30,150,0],[84,8,40,0,180,0],[91,9,0,30,150,2],[133,12,32,0,160,0],[138,11,0,28,150,1]],crushers:[[24,0],[29,80],[109,0],[115,80]]}];
STAGES.push({name:'Boss Rush',boss:'BOSS RUSH',kind:'warden',W:33,cps:[6],rush:true,
 th:{edge:'#e8e8ff',fill:'#14101f',sky:['#050308','#1a0820','#3a0a24'],r1:['#ff5ea8','#0c0610'],r2:['#b9b4d6','#120c18'],spike:'tri',deco:'core'},
 build(f){f(0,1,0,14);f(0,32,15,16);f(31,32,0,14)},spawns:[],movers:[],crushers:[]});
STAGES.forEach((st,i)=>st.key=['prism','foundry','sky','core','rush'][i]);
const RUSH=['warden','hound','kite','null'],BN={warden:'PRISM WARDEN',hound:'COIL HOUND',kite:'GALE KITE',null:'NULL ENGINE'};
let rushIdx=0,rushWait=0,lastSel=0;
const coreOpen=()=>!!(save.cleared[0]&&save.cleared[1]&&save.cleared[2]);

/* ---------- save ---------- */
let save={cleared:[0,0,0,0],best:[0,0,0,0]};
try{const s=JSON.parse(localStorage.getItem('voltline-v2')||'null');if(s&&Array.isArray(s.cleared)){save=s;while(save.cleared.length<4)save.cleared.push(0);while(save.best.length<4)save.best.push(0)}}catch(e){}
if(!Array.isArray(save.bestH))save.bestH=[0,0,0,0];if(!save.rush)save.rush=[0,0];
const persist=()=>{try{localStorage.setItem('voltline-v2',JSON.stringify(save))}catch(e){}};
let musicOn=true,sfxOn=true,hard=false;
try{const o=JSON.parse(localStorage.getItem('voltline-opts')||'{}');musicOn=o.m!==false;sfxOn=o.s!==false;hard=!!o.h}catch(e){}
const saveOpts=()=>{try{localStorage.setItem('voltline-opts',JSON.stringify({m:musicOn,s:sfxOn,h:hard}))}catch(e){}};
const mb=document.getElementById('mus'),sb=document.getElementById('sfx');
const optUI=()=>{mb.textContent=musicOn?'Music on':'Music off';mb.setAttribute('aria-pressed',musicOn);sb.textContent=sfxOn?'Sound on':'Sound off';sb.setAttribute('aria-pressed',sfxOn)};
const togM=()=>{musicOn=!musicOn;saveOpts();optUI()},togS=()=>{sfxOn=!sfxOn;saveOpts();optUI()};
mb.addEventListener('click',()=>{audio();togM()});sb.addEventListener('click',()=>{audio();togS()});optUI();
const unlocked=w=>w===0||!!save.cleared[w-1];
const rb=document.getElementById('reset');let rArm=0;
rb.addEventListener('click',()=>{if(!rArm){rArm=1;rb.textContent='Click again to reset';setTimeout(()=>{rArm=0;rb.textContent='Reset progress'},3000);return}
 save={cleared:[0,0,0,0],best:[0,0,0,0],bestH:[0,0,0,0],rush:[0,0]};persist();rArm=0;rb.textContent='Progress cleared';P.wpn=0;state='title'});

/* ---------- level ---------- */
let S=0,ST=STAGES[0],W=194,ARENA=163,map=[],MV=[],CR=[],WARN=[],POP=[];
function buildMap(){
  ST=STAGES[S];W=ST.W;ARENA=W-31;map=[];for(let y=0;y<H;y++)map.push(new Array(W).fill(' '));
  ST.build((x0,x1,y0,y1,c='#')=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(x>=0&&x<W&&y>=0&&y<H)map[y][x]=c});
  MV=ST.movers.map(([tx,ty,ax,ay,per,ph])=>({bx:tx*TS,by:ty*TS,ax,ay,per,ph,x:tx*TS,y:ty*TS,w:32,h:6,dx:0,dy:0}));
  CR=ST.crushers.map(([tx,ph])=>({cx:tx*TS+8,ph,bot:40,hit:0}));
}
const tile=(x,y)=>(x<0||x>=W)?'#':(y<0||y>=H)?' ':map[y][x];
const solid=(x,y)=>{const c=tile(x,y);return c==='#'||c==='>'||c==='<'};
const ladTop=(x,y)=>tile(x,y)==='H'&&tile(x,y-1)!=='H';

/* ---------- physics ---------- */
function moveX(o){
  o.x+=o.vx;const t0=Math.floor(o.y/TS),t1=Math.floor((o.y+o.h-.01)/TS);
  if(o.vx>0){const tx=Math.floor((o.x+o.w)/TS);for(let ty=t0;ty<=t1;ty++)if(solid(tx,ty)){o.x=tx*TS-o.w;o.vx=0;return true}}
  else if(o.vx<0){const tx=Math.floor(o.x/TS);for(let ty=t0;ty<=t1;ty++)if(solid(tx,ty)){o.x=(tx+1)*TS;o.vx=0;return true}}
  return false;
}
function moveY(o,oneway){
  const pb=o.y+o.h;o.y+=o.vy;o.onG=false;
  const a=Math.floor(o.x/TS),b=Math.floor((o.x+o.w-.01)/TS);
  if(o.vy>0){const ty=Math.floor((o.y+o.h)/TS);for(let tx=a;tx<=b;tx++)if(solid(tx,ty)||(oneway&&ladTop(tx,ty)&&pb<=ty*TS+.5)){o.y=ty*TS-o.h;o.vy=0;o.onG=true;return}}
  else if(o.vy<0){const ty=Math.floor(o.y/TS);for(let tx=a;tx<=b;tx++)if(solid(tx,ty)){o.y=(ty+1)*TS;o.vy=0;return}}
}
const push=(o,v)=>{const s=o.vx;o.vx=v;moveX(o);o.vx=s};
function phys(p){
  if(p.mv){p.x+=p.mv.dx;p.y+=p.mv.dy}
  const pb=p.y+p.h;moveX(p);moveY(p,true);p.mv=null;
  if(!p.onG&&p.vy>=0)for(const m of MV)if(p.x+p.w>m.x&&p.x<m.x+m.w&&pb<=m.y+.6&&p.y+p.h>=m.y){p.y=m.y-p.h;p.vy=0;p.onG=true;p.mv=m;break}
  if(p.onG&&!p.mv){const c=tile(Math.floor((p.x+p.w/2)/TS),Math.floor((p.y+p.h+1)/TS));if(c==='>')push(p,.8);else if(c==='<')push(p,-.8)}
}
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const rectFree=(x,y,w,h)=>{for(let ty=Math.floor(y/TS);ty<=Math.floor((y+h-.01)/TS);ty++)for(let tx=Math.floor(x/TS);tx<=Math.floor((x+w-.01)/TS);tx++)if(solid(tx,ty))return false;return true};

/* ---------- input ---------- */
const K={},prev={};
const KM={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',z:'jump',Z:'jump',k:'jump',K:'jump',' ':'jump',x:'fire',X:'fire',j:'fire',J:'fire',Enter:'start',p:'start',P:'start',Escape:'start',q:'prev',Q:'prev',e:'next',E:'next',c:'next',C:'next',m:'music',M:'music',n:'sfx',N:'sfx'};
addEventListener('keydown',e=>{const k=KM[e.key];if(k&&!(e.target&&e.target.tagName==='BUTTON'&&e.key===' ')){K[k]=true;e.preventDefault();audio()}});
addEventListener('keyup',e=>{const k=KM[e.key];if(k)K[k]=false});
addEventListener('blur',()=>{for(const k in K)K[k]=false});
const pr=k=>K[k]&&!prev[k];
if(matchMedia('(pointer:coarse)').matches||'ontouchstart' in window)document.body.classList.add('touch');
for(const b of document.querySelectorAll('.pad button')){
  const k=b.dataset.k,on=e=>{e.preventDefault();K[k]=true;b.classList.add('on');audio()},off=e=>{e.preventDefault();K[k]=false;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);
}
scr.addEventListener('pointerdown',e=>{scr.focus();audio();
  if(state==='select'){const r=scr.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*VW;const y=(e.clientY-r.top)/r.height*VH;if(y>=208&&y<=230){if(sel!==4){sel=4;return}}else{const i=Math.floor((x-20)/112);if(i>=0&&i<4&&y<208){if(i!==sel){sel=i;return}}}}
  if(state==='title'||state==='select'||state==='got'){K.start=true;setTimeout(()=>K.start=false,90)}});

/* ---------- audio ---------- */
let ac=null;
let mg=null,nbuf=null;
function audio(){if(ac){if(ac.state==='suspended')ac.resume();return}try{ac=new (window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=.8;mg.connect(ac.destination)}catch(e){ac=null}}
function snd(f,d,type='square',f2=0,vol=.04){
  if(!ac||!sfxOn)return;try{const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}
}

/* ---------- music ---------- */
const NOTE=n=>440*Math.pow(2,(n-69)/12);
const pat=(s,len)=>{const a=s.trim().split(/\s+/).map(x=>x==='.'?null:+x);while(a.length%len)a.push(null);return a};

  if(gp){for(const i in GPM)if(gp.buttons[i]&&gp.buttons[i].pressed)cur[GPM[i]]=true;const ax=gp.axes[0]||0,ay=gp.axes[1]||0;if(ax<-.5)cur.left=true;if(ax>.5)cur.right=true;if(ay<-.6)cur.up=true;if(ay>.6)cur.down=true}

  ctx.setTransform(sc,0,0,sc,0,0);ctx.textBaseline='alphabetic';
  if(state==='title'||state==='select'){drawBG(STAGES[state==='select'?sel:0].th);
    if(state==='title'){dim(.35);text('VOLTLINE',VW/2,104,46,MINT,'center',18);text('a vector action run in three sectors',VW/2,128,12,CRM,'center',0);
      text('◀  '+(hard?'HARD':'NORMAL')+'  ▶',VW/2,160,14,hard?CORAL:MINT,'center',8);text(hard?'Hits sting harder, enemies are tougher, pickups heal less':'The standard run',VW/2,176,10,'rgba(243,233,255,.7)','center',0);if(tick%60<40)text('Press Enter or tap to start',VW/2,204,13,GOLD);text('Z jump · X fire (hold to charge) · Down+Z slide · Q/E weapons',VW/2,240,10,'rgba(243,233,255,.75)','center',0)}
    else drawSelect();return}
  drawBG(ST.th);
  ctx.save();const sx=shake?(Math.random()-.5)*shake:0,sy=shake?(Math.random()-.5)*shake:0;ctx.translate(-Math.round(camX)+sx,sy);
  drawTiles();drawEnemies();drawBoss(B);drawHero();drawShots();ctx.restore();
  text('CORE',8,15,9,CRM,'left',0);bar(36,8,P.hp,28,MINT);
  if(P.wpn){text(WPN[P.wpn].s,8,27,9,WPN[P.wpn].c,'left',0);bar(36,20,EN[P.wpn],28,WPN[P.wpn].c)}
  if(B&&B.st!=='drop'){text(BN[B.kind],VW-8,28,9,CRM,'right',0);bar(VW-8,8,Math.min(B.shown,B.hp),28,B.hp<=14?CORAL:PINK,true)}
  text(fmt(clock)+(hard?'  HARD':''),VW/2,15,9,hard?CORAL:'rgba(243,233,255,.7)','center',0);
  if(ST.wind&&gust&&!arena)text('GUST',VW/2,28,9,SKY,'center',4);
  if(B&&B.st==='intro')text(BN[B.kind],VW/2,110,22,ST.th.edge);
  if(ST.rush)text('RUSH '+(rushIdx+1)+'/4',VW/2,28,9,PINK,'center',4);
  if(state==='pause'){dim(.65);text('PAUSED',VW/2,70,24,GOLD);
    for(let w=0;w<4;w++){const y=100+w*24,u=unlocked(w),on=P.wpn===w;text((on?'▸ ':'  ')+(u?WPN[w].n:'LOCKED'),150,y,11,u?WPN[w].c:'rgba(255,255,255,.25)','left',on?6:0);if(u&&w)bar(270,y-8,EN[w],28,WPN[w].c)}
    text('↑ ↓ or Q/E to switch · Enter to resume',VW/2,215,10,CRM,'center',0);text('M music '+(musicOn?'on':'off')+' · N sound '+(sfxOn?'on':'off'),VW/2,232,10,'rgba(243,233,255,.6)','center',0)}
  else if(state==='dead'&&deadT>40){text('SIGNAL LOST',VW/2,130,20,CORAL);text('rebooting at checkpoint',VW/2,150,10,CRM,'center',0)}
  else if(state==='got'&&lastWin.rush){dim(Math.min(.8,gotT/50));
    text('BOSS RUSH COMPLETE',VW/2,90,24,PINK,'center',12);text(fmt(clock),VW/2,136,34,MINT,'center',14);
    text((lastWin.pb?'New best':'Best '+fmt(save.rush[hard?1:0]))+'  ·  Reboots '+deaths+(hard?'  ·  Hard':''),VW/2,164,11,CRM,'center',0);
    if(gotT>60&&tick%60<40)text('Press Enter to continue',VW/2,230,12,GOLD)}
  else if(state==='got'&&lastWin.fin){dim(Math.min(.8,gotT/50));
    text('NULL ENGINE OFFLINE',VW/2,70,22,CORAL,'center',12);text('Run time '+fmt(clock)+'  ·  Reboots '+deaths,VW/2,92,11,CRM,'center',0);
    if(gotT>30){text('THE GRID IS FREE',VW/2,138,30,MINT,'center',16);const tot=(hard?save.bestH:save.best).reduce((a,b)=>a+b,0);text((hard?'Hard mode best':'Best')+' times across all four sectors: '+fmt(tot),VW/2,166,11,CRM,'center',0)}
    if(gotT>60){text('Thanks for playing Voltline.',VW/2,196,12,GOLD,'center',6)}
    if(gotT>60&&tick%60<40)text('Press Enter to continue',VW/2,240,12,GOLD)}
  else if(state==='got'){dim(Math.min(.75,gotT/50));const w=WPN[lastWin.w];
    text(STAGES[S].boss+' OFFLINE',VW/2,74,22,ST.th.edge,'center',12);text('Run time '+fmt(clock)+'  ·  Reboots '+deaths,VW/2,96,11,CRM,'center',0);
    if(gotT>20){text('WEAPON ACQUIRED',VW/2,132,11,'rgba(243,233,255,.7)','center',0);text(w.n,VW/2,156,22,w.c,'center',12);text(w.d+' Press Q/E to switch.',VW/2,176,10,CRM,'center',0)}
    if(lastWin.all&&lastWin.first&&gotT>40)text('All three wardens are down. The Null Core has opened.',VW/2,206,12,GOLD,'center',6);
    if(gotT>60&&tick%60<40)text('Press Enter to continue',VW/2,240,12,GOLD)}
}
let acc=0,last=performance.now();
function frame(now){acc+=Math.min(100,now-last);last=now;while(acc>=1000/60){step();acc-=1000/60}draw();musicTick();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&/github\.io$/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
}
</script>
